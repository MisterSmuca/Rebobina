    </header>


    <main>
        
        <div class="container">
            <h1>Feedback</h1>

            <p class="subtitulo">REBOBINA</p>
            
            <form id="formulario">

                <div class="campo">

                    <label for="nome">NOME COMPLETO</label>

                    <input type="text"
                        class="form-control"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome">

                </div>


                <div class="campo">

                    <label for="email">E-MAIL</label>

                    <input type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail">

                </div>


                <div class="campo">

                    <label for="idade">IDADE</label>

                    <input type="number"
                        class="form-control"
                        id="idade"
                        name="idade"
                        placeholder="Digite sua idade">

                </div>


                <div class="campo">

                    <label for="telefone">TELEFONE</label>

                    <input type="tel"
                        class="form-control"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000">

                </div>


                <div class="campo">

                    <label for="cidade">CIDADE</label>

                    <input type="text"
                        class="form-control"
                        id="cidade"
                        name="cidade"
                        placeholder="Digite sua cidade">

                </div>


                <div class="campo">

                    <label for="mensagem">DEIXE SUA MENSAGEM</label>

                    <textarea class="form-control"
                        id="mensagem"
                        name="mensagem"
                        placeholder="Digite sua mensagem..."></textarea>

                </div>


                <div class="botoes">

                    <button type="submit" class="btn">
                        ENVIAR
                    </button>

                    <button type="reset" class="btn limpar">
                        LIMPAR
                    </button>

                </div>

            </form>

        </div>

    </main>


    <footer class="bg-dark py-4">

        <p class="text-white text-center">
            © 2026 Rebobina
        </p>

        <div class="d-flex justify-content-center gap-3 fs-4">

            <a href="formulario.html"
                class="text-white"
                aria-label="Formulário">
