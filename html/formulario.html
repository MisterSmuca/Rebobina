<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/formulario.css">

    <title>Formulário Rebobina</title>

</head>

<body>

    <div class="container">

        <h1>FORMULÁRIO</h1>
        <p class="subtitulo">REBOBINA</p>

        <form id="formulario">

            <div class="campo">
                <label for="nome">NOME COMPLETO</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome">
            </div>

            <div class="campo">
                <label for="email">E-MAIL</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail">
            </div>

            <div class="campo">
                <label for="idade">IDADE</label>
                <input type="number" class="form-control" id="idade" name="idade" placeholder="Digite sua idade">
            </div>

            <div class="campo">
                <label for="telefone">TELEFONE</label>
                <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            </div>

            <div class="campo">
                <label for="cidade">CIDADE</label>
                <input type="text" class="form-control" id="cidade" name="cidade" placeholder="Digite sua cidade">
            </div>

            <div class="campo">
                <label for="genero">GÊNERO MUSICAL FAVORITO</label>

                <select class="form-select" id="genero" name="genero">
                    <option value="">Selecione uma opção</option>
                    <option value="rock">Rock</option>
                    <option value="pop">Pop</option>
                    <option value="new-wave">New Wave</option>
                    <option value="disco">Disco</option>
                    <option value="eletronica">Eletrônica</option>
                </select>
            </div>

            <div class="campo">
                <label>VOCÊ VIVEU OS ANOS 80?</label>

                <div class="opcoes">
                    <label>
                        <input type="radio" name="anos80" value="sim">
                        SIM
                    </label>

                    <label>
                        <input type="radio" name="anos80" value="nao">
                        NÃO
                    </label>
                </div>
            </div>

            <div class="campo">
                <label for="mensagem">DEIXE SUA MENSAGEM</label>

                <textarea class="form-control" id="mensagem" name="mensagem"
                    placeholder="Digite sua mensagem..."></textarea>
            </div>

            <div class="botoes">
                <button type="submit" class="btn">ENVIAR</button>
                <button type="reset" class="btn limpar">LIMPAR</button>
            </div>

        </form>

        <p class="rodape">★ SISTEMA REBOBINA 1985 ★</p>

    </div>
    <script src="../js/formulario.js"></script>
</body>

</html>
