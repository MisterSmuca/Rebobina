<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" href="../img/avanco-rapido.png">

    <link rel="stylesheet" href="../css/recibo.css">

    <title>Recibo - Rebobina</title>
</head>

<body>
    <div class="container recibo">

        <h1>REBOBINA</h1>

        <p class="subtitulo">RECIBO DE PARTICIPAÇÃO</p>

        <div class="informacao">
            <strong>NOME:</strong>
            <span id="reciboNome"></span>
        </div>

        <div class="informacao">
            <strong>E-MAIL:</strong>
            <span id="reciboEmail"></span>
        </div>

        <div class="informacao">
            <strong>IDADE:</strong>
            <span id="reciboIdade"></span>
        </div>

        <div class="informacao">
            <strong>TELEFONE:</strong>
            <span id="reciboTelefone"></span>
        </div>

        <div class="informacao">
            <strong>CIDADE:</strong>
            <span id="reciboCidade"></span>
        </div>

        <div class="informacao">
            <strong>GÊNERO MUSICAL:</strong>
            <span id="reciboGenero"></span>
        </div>

        <div class="informacao">
            <strong>VIVEU OS ANOS 80?</strong>
            <span id="reciboAnos80"></span>
        </div>

        <div class="informacao">
            <strong>MENSAGEM:</strong>
            <p id="reciboMensagem"></p>
        </div>

        <p class="rodape">
            ★ SISTEMA REBOBINA 1985 ★
        </p>

        <button class="btn btn-dark botao-imprimir" onclick="window.print()">
            IMPRIMIR RECIBO
        </button>

    </div>

    <script src="../js/recibo.js"></script>





</body>

</html>
